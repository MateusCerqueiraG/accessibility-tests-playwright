name: Accessibility Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: Gate de acessibilidade (página conforme → verde)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox
      - name: Audita página conforme (axe-core)
        run: pytest --browser chromium --browser firefox --reruns 2 --reruns-delay 2 --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-gate
          path: allure-results
          if-no-files-found: ignore

  demo:
    name: Demo — página problemática (acha violação → vermelho, falha permitida)
    runs-on: ubuntu-latest
    continue-on-error: true   # falha esperada: não derruba o badge geral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox
      - name: Audita página problemática (deve reprovar)
        run: pytest -m demo --browser chromium --browser firefox --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-demo
          path: allure-results
          if-no-files-found: ignore

  report:
    name: Publish Allure report
    needs: [gate, demo]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure results (gate + demo)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Load previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Publish report to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" allure-history
          cd allure-history
          rm -rf .git
          touch .nojekyll
          git init -q
          git checkout -B gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Allure report for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
